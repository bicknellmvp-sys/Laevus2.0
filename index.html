<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LAEVUS</title>
    <meta name="description" content="A sovereign metaphysical portal and spiritual cybernetic guide exploring tarot divination, oracle consultation, and inner patterns." />
    <meta property="og:title" content="LAEVUS" />
    <meta property="og:description" content="A sovereign metaphysical portal and spiritual cybernetic guide exploring tarot divination, oracle consultation, and inner patterns." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Ruthie&family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <!-- PDF.js for rendering PDF previews -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
      :root {
        --bg: #050209; /* deepest purple, almost black */
        --ink: #F8F7F4;
        --accent: #DC143C;
      }
      
      @keyframes acidTrip {
        0% {
          background-position: 0% 50%, 50% 100%, 0% 0%;
        }
        50% {
          background-position: 100% 50%, 0% 0%, 50% 100%;
        }
        100% {
          background-position: 0% 50%, 50% 100%, 0% 0%;
        }
      }

      body {
        font-family: 'Space Mono', monospace;
        background-color: var(--bg);
        /* Multilayered organic gradients that create a rich, tactile slow-moving psychedelic aura */
        background-image: 
          radial-gradient(circle at 15% 25%, rgba(139, 92, 246, 0.12) 0%, transparent 45%),
          radial-gradient(circle at 85% 75%, rgba(236, 72, 153, 0.09) 0%, transparent 40%),
          radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.06) 0%, transparent 55%),
          radial-gradient(circle, rgba(139, 92, 246, 0.09) 1px, transparent 1px), /* enhanced purple dot grid */
          url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
        background-size: 200% 200%, 200% 200%, 200% 200%, 30px 30px, auto;
        animation: acidTrip 25s ease-in-out infinite;
        color: var(--ink);
      }

      /* Give all black panel elements a tactile matte grain texture */
      .bg-zinc-950 {
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='1' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.025'/%3E%3C/svg%3E") !important;
        background-color: #09090b !important;
      }
      .bg-zinc-900 {
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='1' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.02'/%3E%3C/svg%3E") !important;
        background-color: #18181b !important;
      }
      
      /* 3-Font Hierarchy: Syne (Display), Plus Jakarta Sans (Body), Space Mono (Code/Numerals) */
      .font-syne {
        font-family: 'Syne', sans-serif;
      }
      .font-mono-custom, .font-mono {
        font-family: 'Space Mono', monospace;
      }
      .font-google-sans, .font-sans, .font-inter {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif !important;
      }
      .font-ruthie {
        font-family: 'Ruthie', cursive !important;
      }
      .font-zeyada {
        font-family: 'Ruthie', cursive !important;
      }

      /* Smooth scrolling for the whole app */
      html {
        scroll-behavior: smooth;
      }

      /* Dripping blood / dark fluid fill down animation */
      @keyframes rushDripDown {
        0% {
          background-position: 0 0%;
        }
        100% {
          background-position: 0 100%;
        }
      }

      .animate-drip-black {
        background: linear-gradient(180deg, #09090b 0%, #09090b 50%, #DC143C 50%, #DC143C 100%);
        background-size: 100% 200%;
        background-position: 0 0%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: rushDripDown 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      ::selection {
        background-color: rgba(88, 28, 135, 0.5);
        color: rgb(233, 213, 255);
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
